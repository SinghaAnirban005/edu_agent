version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnai
      POSTGRES_PASSWORD: learnai_secret
      POSTGRES_DB: learnai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnai -d learnai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: learnai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

